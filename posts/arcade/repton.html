      ctx.arc(0, 0, 26 + 4 * pulse, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#04202a';
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 12, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = C.pink;
    ctx.beginPath();
    ctx.arc(0, -1, 6, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 2;
    for (const s of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(s * (10 + i * 3), 7);
        ctx.lineTo(s * (15 + i * 4) + Math.sin(time * 4 + i) * 4, 20 + i * 5);
        ctx.stroke();
      }
    }
    ctx.fillStyle = C.white;
    ctx.fillRect(-1, -3, 2, 2);
    ctx.restore();
  }

  function drawMine(m) {
    const x = m.x - camera;
    ctx.save();
    ctx.translate(x, m.y);
    ctx.rotate(m.t * 1.9);
    ctx.strokeStyle = C.pink;
    ctx.fillStyle = '#28061f';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(0, -11);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = Math.sin(m.t * 8) > 0 ? C.yellow : C.red;
    ctx.fillRect(-1.5, -1.5, 3, 3);
    ctx.restore();
  }

  function drawEnemy(e) {
    const x = e.x - camera;
    if (x < -60 || x > W + 60) return;
    if (e.hurt && Math.floor(time * 30) % 2 === 0) return;
    switch (e.type) {
      case 'saucer': drawSaucer(e); break;
      case 'nova': drawNova(e); break;
      case 'dyne': drawDyne(e); break;
      case 'minelayer': drawMinelayer(e); break;
      case 'quarrior': drawQuarrior(e); break;
      case 'drayne': drawDrayne(e); break;
      case 'guardian': drawGuardian(e); break;
      case 'dart': drawDart(e); break;
      case 'caveship': drawSaucer(e); break;
    }
  }

  function drawGuardian(e) {
    const x = e.x - camera;
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.save();
    ctx.translate(x, e.y);
    ctx.shadowColor = C.pink;
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#21081a';
    ctx.strokeStyle = C.pink;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.save();
    ctx.rotate(ang);
    ctx.fillStyle = C.pink;
    ctx.fillRect(0, -3, 22, 6);
    ctx.fillStyle = C.yellow;
    ctx.fillRect(16, -2, 5, 4);
    ctx.restore();
    ctx.fillStyle = C.white;
    ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();
  }

  function drawDart(e) {
    const x = e.x - camera;
    ctx.save();
    ctx.translate(x, e.y);
    ctx.rotate(Math.atan2(e.vy || 0, e.vx || 1));
    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 12;
    ctx.fillStyle = C.cyan;
    ctx.beginPath();
    ctx.moveTo(13, 0);
    ctx.lineTo(-8, -6);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-8, 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.white;
    ctx.fillRect(0, -1, 5, 2);
    ctx.restore();
  }

  function drawFighter(s) {
    ctx.save();
    ctx.scale(s, s);
    ctx.lineWidth = 2 / s;

    // Swept wings.
    ctx.fillStyle = '#2a0d27';
    ctx.strokeStyle = C.pink;
    ctx.beginPath();
    ctx.moveTo(-4, -5);
    ctx.lineTo(-17, -16);
    ctx.lineTo(-25, -15);
    ctx.lineTo(-11, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-4, 5);
    ctx.lineTo(-17, 16);
    ctx.lineTo(-25, 15);
    ctx.lineTo(-11, 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Tail fins.
    ctx.fillStyle = '#18091f';
    ctx.beginPath();
    ctx.moveTo(-22, -4);
    ctx.lineTo(-28, -13);
    ctx.lineTo(-34, -13);
    ctx.lineTo(-31, -1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-22, 4);
    ctx.lineTo(-28, 13);
    ctx.lineTo(-34, 13);
    ctx.lineTo(-31, 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Fuselage.
    ctx.fillStyle = '#081827';
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 2.2 / s;
    ctx.beginPath();
    ctx.moveTo(32, 0);
    ctx.lineTo(14, -5);
    ctx.lineTo(-10, -6);
    ctx.lineTo(-26, -4);
    ctx.lineTo(-31, 0);
    ctx.lineTo(-26, 4);
    ctx.lineTo(-10, 6);
    ctx.lineTo(14, 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Dorsal stripe.
    ctx.fillStyle = C.pink;
    ctx.fillRect(-20, -2, 34, 3);
    // Cockpit and nose light.
    ctx.fillStyle = C.cyan;
    ctx.fillRect(6, -4, 12, 3);
    ctx.fillStyle = C.yellow;
    ctx.fillRect(24, -1.5, 6, 3);
    ctx.fillStyle = C.white;
    ctx.fillRect(-25, -1, 4, 2);
    ctx.restore();
  }

  function drawShip() {
    if (!player.alive) return;
    const x = player.x - camera;
    const y = player.y;
    const blink = player.invuln > 0 && Math.floor(time * 14) % 2 === 0;

    ctx.save();
    ctx.translate(x, y);

    if (energy > 0) {
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
      g.addColorStop(0, 'rgba(255,225,77,0.22)');
      g.addColorStop(1, 'rgba(255,225,77,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, TAU);
      ctx.fill();
    }

    if (player.shieldOn) {
      const pulse = 0.55 + 0.25 * Math.sin(time * 12);
      ctx.save();
      ctx.shadowColor = C.cyan;
      ctx.shadowBlur = 18;
      ctx.strokeStyle = 'rgba(99,231,255,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = pulse * 0.35;
      ctx.fillStyle = C.cyan;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(242,246,255,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 36, time * 2, time * 2 + 2.2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.globalAlpha = blink ? 0.38 : 1;
    ctx.scale(player.face, 1);

    if (player.thrust && !player.shieldOn) {
      const f = 12 + Math.sin(time * 40) * 5;
      ctx.fillStyle = 'rgba(99,231,255,0.8)';
      ctx.beginPath();
      ctx.moveTo(-24, -5);
      ctx.lineTo(-24 - f, 0);
      ctx.lineTo(-24, 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = C.white;
      ctx.beginPath();
      ctx.moveTo(-24, -2.5);
      ctx.lineTo(-24 - f * 0.55, 0);
      ctx.lineTo(-24, 2.5);
      ctx.closePath();
      ctx.fill();
    }

    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 12;
    drawFighter(1);

    ctx.restore();
  }

  function drawBullets() {
    for (const b of bullets) {
      const x = b.x - camera;
      if (x < -30 || x > W + 30) continue;
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x, b.y);
      ctx.lineTo(x - Math.sign(b.vx) * 18, b.y);
      ctx.stroke();
      ctx.strokeStyle = C.white;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, b.y);
      ctx.lineTo(x - Math.sign(b.vx) * 10, b.y);
      ctx.stroke();
      ctx.restore();
    }
    for (const b of eBullets) {
      const x = b.x - camera;
      if (x < -20 || x > W + 20) continue;
      ctx.save();
      ctx.translate(x, b.y);
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 9;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(0, 0, 3.2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = C.white;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(6, 0);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawOffscreen() {
    if (phase === 'surface' && drayne && drayne.state === 'beam') {
      const sx = drayne.x - camera;
      if (sx < 20 || sx > W - 20) {
        const side = sx < 20 ? 1 : -1;
        const x = sx < 20 ? 18 : W - 18;
        const y = clamp(drayne.y, 90, 460);
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(side, 1);
        ctx.fillStyle = Math.sin(time * 10) > 0 ? C.pink : C.yellow;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(14, -8);
        ctx.lineTo(14, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        text('SIPHON', x - side * 27, y, 8, C.pink, side > 0 ? 'right' : 'left');
      }
    }

    if (phase === 'surface' && BASE_X - camera > W - 30) {
      const y = 216;
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 5);
      ctx.fillStyle = C.pink;
      ctx.beginPath();
      ctx.moveTo(W - 18, y);
      ctx.lineTo(W - 32, y - 8);
      ctx.lineTo(W - 32, y + 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      text('BASE ' + Math.floor(baseProgress) + '%', W - 38, y, 8, C.pink, 'right');
    }

    if (phase === 'surface' && energy > 0) {
      let best = null;
      let bd = Infinity;
      for (const s of stations) {
        const d = Math.abs(s.x - player.x);
        if (d < bd) { bd = d; best = s; }
      }
      if (best && Math.abs(best.x - camera - W / 2) > W / 2 - 60) {
        const sx = best.x - camera;
        const edge = sx < 0 ? 14 : W - 14;
        const side = sx < 0 ? 1 : -1;
        ctx.save();
        ctx.translate(edge, clamp(player.y, 100, 480));
        ctx.scale(side, 1);
        ctx.fillStyle = C.yellow;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(12, -7);
        ctx.lineTo(12, 7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        text('CHARGE', edge - side * 26, clamp(player.y, 100, 480), 8, C.yellow, side > 0 ? 'right' : 'left');
      }
    }
  }

  function drawSurfaceScene() {
    drawStars();
    drawGround();
    drawCity();
    drawBase();
    drawStations();

    if (drayne) drawDrayneBeam();
    for (const e of enemies) if (e.type === 'dyne') drawDyneBeam(e);

    for (const e of enemies) drawEnemy(e);
    for (const m of mines) drawMine(m);
    drawShip();
    drawBullets();
    drawParticles();
    drawFloats();
    drawOffscreen();
  }

  /* ============================================================
     Rendering: caverns
     ============================================================ */
  function drawCavernScene() {
    ctx.fillStyle = '#030107';
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(W * 0.5, H * 0.5, 40, W * 0.5, H * 0.5, W * 0.75);
    g.addColorStop(0, 'rgba(40,18,70,0.25)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const pts = [];
    const first = Math.floor((camera - 40) / cave.step) * cave.step;
    for (let wx = first; wx <= camera + W + 40; wx += cave.step) {
      const t = terrainAt(clamp(wx, 0, worldW));
      pts.push({ x: wx - camera, c: t.ceil, f: t.floor });
    }
    if (!pts.length) return;

    // Ceiling mass.
    ctx.beginPath();
    ctx.moveTo(pts[0].x, 0);
    for (const p of pts) ctx.lineTo(p.x, p.c);
    ctx.lineTo(pts[pts.length - 1].x, 0);
    ctx.closePath();
    ctx.fillStyle = '#080411';
    ctx.fill();
    // Floor mass.
    ctx.beginPath();
    ctx.moveTo(pts[0].x, H);
    for (const p of pts) ctx.lineTo(p.x, p.f);
    ctx.lineTo(pts[pts.length - 1].x, H);
    ctx.closePath();
    ctx.fillStyle = '#080411';
    ctx.fill();

    // Luminous cave edges.
    ctx.save();
    ctx.shadowColor = C.green;
    ctx.shadowBlur = 9;
    ctx.strokeStyle = C.green;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i].x, pts[i].c);
      else ctx.lineTo(pts[i].x, pts[i].c);
    }
    ctx.stroke();
    ctx.shadowColor = C.pink;
    ctx.strokeStyle = C.pink;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i].x, pts[i].f);
      else ctx.lineTo(pts[i].x, pts[i].f);
    }
    ctx.stroke();
    ctx.restore();

    // Rocky striations.
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = C.purple;
    ctx.lineWidth = 1;
    for (const p of pts) {
      if (Math.abs((p.x + camera) % 90) < cave.step) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.c);
        ctx.lineTo(p.x + 9, p.c + 26);
        ctx.lineTo(p.x + 2, p.c + 46);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x, p.f);
        ctx.lineTo(p.x - 8, p.f - 24);
        ctx.stroke();
      }
    }
    ctx.restore();

    for (const cr of cave.crystals) {
      const x = cr.x - camera;
      if (x < -10 || x > W + 10) continue;
      const tw = 0.55 + 0.45 * Math.sin(time * 3 + cr.ph);
      ctx.save();
      ctx.globalAlpha = tw;
      ctx.fillStyle = cr.c;
      ctx.shadowColor = cr.c;
      ctx.shadowBlur = 7;
      ctx.beginPath();
      ctx.moveTo(x, cr.y - cr.s);
      ctx.lineTo(x + cr.s, cr.y);
      ctx.lineTo(x, cr.y + cr.s);
      ctx.lineTo(x - cr.s, cr.y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    drawParticles();
    for (const e of enemies) drawEnemy(e);
    drawCore();
    drawShip();
    drawBullets();
    drawFloats();

    if (core && core.hp > 0) {
      const cx = core.x - camera;
      if (cx > W + 20) {
        ctx.save();
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 6);
        ctx.fillStyle = C.yellow;
        ctx.beginPath();
        ctx.moveTo(W - 18, 280);
        ctx.lineTo(W - 32, 272);
        ctx.lineTo(W - 32, 288);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        text('POWER CORE', W - 38, 280, 8, C.yellow, 'right');
      }
    }
  }

  function drawCore() {
    if (!core) return;
    const x = core.x - camera;
    if (x < -90 || x > W + 90) return;
    const pulse = 0.6 + 0.4 * Math.sin(time * 4);
    const hurt = core.hurt > 0;

    ctx.save();
    ctx.translate(x, core.y);
    ctx.shadowColor = hurt ? C.white : C.yellow;
    ctx.shadowBlur = 22;

    ctx.strokeStyle = hurt ? C.white : C.orange;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(0, 0, 58 + i * 9, 30 + i * 7, core.angle + i * 0.6, 0, TAU);
      ctx.stroke();
    }
    ctx.strokeStyle = C.pink;
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {
      const a = core.angle * 0.7 + i * TAU / 8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 26, Math.sin(a) * 20);
      ctx.lineTo(Math.cos(a) * 44, Math.sin(a) * 30);
      ctx.stroke();
    }
    const rg = ctx.createRadialGradient(0, 0, 3, 0, 0, core.r);
    rg.addColorStop(0, hurt ? C.white : C.yellow);
    rg.addColorStop(0.45, hurt ? C.white : C.orange);
    rg.addColorStop(1, 'rgba(255,77,94,0.12)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0, 0, core.r * (0.8 + pulse * 0.12), 0, TAU);
    ctx.fill();
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, TAU);
    ctx.stroke();
    ctx.restore();

    // Health rail.
    const pct = clamp(core.hp / core.max, 0, 1);
    const bx = x - 60;
    const by = core.y - 72;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(bx, by, 120, 8);
    ctx.strokeStyle = 'rgba(255,225,77,0.6)';
    ctx.strokeRect(bx + 0.5, by + 0.5, 119, 7);
    ctx.fillStyle = pct > 0.35 ? C.yellow : C.red;
    ctx.fillRect(bx + 2, by + 2, 116 * pct, 4);
    text('POWER CORE', x, by - 10, 9, C.yellow);
  }

  /* ============================================================
     Rendering: HUD
     ============================================================ */
  function drawScanner(x, y, w, h) {
    drawPanel(x, y, w, h, C.green);
    text('LONG RANGE SCANNER', x + w / 2, y + 10, 8, 'rgba(125,255,77,0.7)');

    const rx = x + 14;
    const ry = y + 19;
    const rw = w - 28;
    const rh = 34;
    ctx.strokeStyle = 'rgba(125,255,77,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
    for (let i = 1; i < 6; i++) {
      const gx = rx + (rw / 6) * i;
      ctx.strokeStyle = 'rgba(125,255,77,0.12)';
      ctx.beginPath();
      ctx.moveTo(gx, ry + 1);
      ctx.lineTo(gx, ry + rh - 1);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(125,255,77,0.18)';
    ctx.beginPath();
    ctx.moveTo(rx + 1, ry + rh / 2);
    ctx.lineTo(rx + rw - 1, ry + rh / 2);
    ctx.stroke();

    if (phase !== 'surface') {
      ctx.save();
      ctx.globalAlpha = 0.55;
      for (let i = 0; i < 16; i++) {
        const yy = ry + rand(1, rh - 2);
        ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(99,231,255,0.35)' : 'rgba(255,77,210,0.25)';
        ctx.beginPath();
        ctx.moveTo(rx + rand(0, rw * 0.5), yy);
        ctx.lineTo(rx + rand(rw * 0.5, rw), yy + rand(-2, 2));
        ctx.stroke();
      }
      ctx.restore();
      text('RADAR OFFLINE', x + w / 2, ry + rh / 2, 9, C.red);
    } else {
      const mapX = (wx) => rx + clamp(wx / worldW, 0, 1) * rw;
      const mapY = (wy) => ry + clamp(wy / GROUND_Y, 0, 1) * rh;

      // Base.
      const bx = mapX(BASE_X);
      ctx.fillStyle = C.pink;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(bx, ry + 2, 3, rh - 4);
      ctx.globalAlpha = 1;
      // Stations.
      for (const s of stations) {
        ctx.fillStyle = C.green;
        ctx.fillRect(mapX(s.x) - 1, ry + rh - 4, 3, 3);
      }
      // Enemies.
      for (const e of enemies) {
        ctx.fillStyle = e.color;
        ctx.fillRect(mapX(e.x) - 1.5, mapY(e.y) - 1.5, 3, 3);
      }
      // Player.
      const px = mapX(player.x);
      const py = mapY(player.y);
      ctx.fillStyle = C.white;
      ctx.beginPath();
      ctx.moveTo(px + 4, py);
      ctx.lineTo(px - 3, py - 3);
      ctx.lineTo(px - 3, py + 3);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawLocalRadar(x, y, w, h) {
    drawPanel(x, y, w, h, C.cyan);
    text('LOCAL', x + w / 2, y + 10, 8, 'rgba(99,231,255,0.7)');

    const rx = x + 8;
    const ry = y + 18;
    const rw = w - 16;
    const rh = h - 26;
    ctx.strokeStyle = 'rgba(99,231,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
    ctx.beginPath();
    ctx.moveTo(rx + rw / 2, ry + 1);
    ctx.lineTo(rx + rw / 2, ry + rh - 1);
    ctx.moveTo(rx + 1, ry + rh / 2);
    ctx.lineTo(rx + rw - 1, ry + rh / 2);
    ctx.stroke();

    const cx = rx + rw / 2;
    const cy = ry + rh / 2;

    if (phase === 'surface') {
      ctx.save();
      ctx.strokeStyle = 'rgba(99,231,255,0.35)';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(rw, rh) * 0.38, 0, TAU);
      ctx.stroke();
      const sweep = time * 2.4;
      ctx.strokeStyle = 'rgba(99,231,255,0.25)';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(sweep) * rw * 0.48, cy + Math.sin(sweep) * rh * 0.48);
      ctx.stroke();
      for (const e of enemies) {
        const dx = (e.x - player.x) / 560;
        const dy = (e.y - player.y) / 400;
        if (Math.abs(dx) > 0.9 || Math.abs(dy) > 0.9) continue;
        ctx.fillStyle = e.color;
        ctx.fillRect(cx + dx * rw * 0.46 - 1.5, cy + dy * rh * 0.46 - 1.5, 3, 3);
      }
      ctx.fillStyle = C.white;
      ctx.fillRect(cx - 1, cy - 1, 2, 2);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = 0.5;
      for (let i = 0; i < 9; i++) {
        ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(99,231,255,0.3)' : 'rgba(255,77,210,0.25)';
        ctx.beginPath();
        ctx.moveTo(rx + rand(2, rw - 2), ry + rand(2, rh - 2));
        ctx.lineTo(rx + rand(2, rw - 2), ry + rand(2, rh - 2));
        ctx.stroke();
      }
      ctx.restore();
      text('NO SIGNAL', cx, cy, 8, C.red);
    }
  }

  function drawMecoMeter(x, y, w, h) {
    // Vertical MECO / base-construction rail.
    const label = phase === 'surface' ? 'MECO' : 'CORE';
    for (let i = 0; i < label.length; i++) {
      text(label[i], x - 12, y + 12 + i * 14, 9, 'rgba(99,231,255,0.65)');
    }
    const segs = 8;
    const segH = (h - 8) / segs;
    let pct;
    if (phase === 'surface') pct = baseProgress / 100;
    else pct = core ? clamp(core.hp / core.max, 0, 1) : 0;
    const lit = Math.ceil(pct * segs);

    for (let i = 0; i < segs; i++) {
      const sy = y + h - 4 - (i + 1) * segH;
      const on = i < lit;
      ctx.fillStyle = on
        ? (phase === 'surface' ? (i > 5 ? C.red : C.pink) : (pct < 0.35 ? C.red : C.yellow))
        : 'rgba(80,50,110,0.28)';
      ctx.fillRect(x, sy + 1, 24, segH - 3);
      if (on) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillRect(x + 2, sy + 2, 20, 1);
      }
    }
    text(phase === 'surface' ? 'BASE' : 'CORE', x + 12, y + h + 9, 7, 'rgba(190,220,255,0.4)');
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, HUD_TOP - 6, W, H - HUD_TOP + 6);
    line(10, HUD_TOP - 5, W - 10, HUD_TOP - 5, C.green, 1, 0.45);
    line(10, HUD_TOP - 2, W - 10, HUD_TOP - 2, C.pink, 1, 0.22);

    // Score / ships / nukes.
    drawPanel(24, 600, 286, 92, C.cyan);
    text('SCORE', 34, 611, 8, 'rgba(99,231,255,0.6)', 'left');
    glowText(pad(score, 6), 167, 636, 27, C.white, 'center', 8);
    line(38, 652, 296, 652, C.cyan, 1, 0.28);

    text('SHIPS', 34, 666, 8, 'rgba(190,220,255,0.55)', 'left');
    for (let i = 0; i < Math.min(lives, 8); i++) {
      const sx = 78 + i * 19;
      ctx.fillStyle = i < lives ? C.white : 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.moveTo(sx + 6, 666);
      ctx.lineTo(sx - 5, 661);
      ctx.lineTo(sx - 2, 666);
      ctx.lineTo(sx - 5, 671);
      ctx.closePath();
      ctx.fill();
    }

    text('NUKES', 184, 666, 8, 'rgba(190,220,255,0.55)', 'left');
    for (let i = 0; i < 5; i++) {
      const sx = 231 + i * 14;
      ctx.strokeStyle = i < nukes ? C.yellow : 'rgba(255,225,77,0.18)';
      ctx.fillStyle = i < nukes ? 'rgba(255,225,77,0.22)' : 'transparent';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx, 665, 4.5, 0, TAU);
      ctx.fill();
      ctx.stroke();
      if (i < nukes) {
        ctx.fillStyle = C.yellow;
        ctx.fillRect(sx - 1, 663, 2, 2);
      }
    }

    // Scanner + shield.
    drawScanner(322, 600, 376, 92);
    text('SHIELD', 334, 668, 8, 'rgba(190,220,255,0.5)', 'left');
    const shx = 384;
    const shy = 664;
    const shw = 218;
    ctx.strokeStyle = 'rgba(99,231,255,0.35)';
    ctx.strokeRect(shx + 0.5, shy + 0.5, shw, 7);
    ctx.fillStyle = player.shieldOn ? C.purple : (shieldLock ? C.red : C.cyan);
    ctx.fillRect(shx + 2, shy + 2, (shw - 4) * clamp(shieldEnergy / 100, 0, 1), 4);
    if (shieldLock) text('RECHARGE', shx + shw + 32, 668, 7, C.red);

    let status = '';
    let statusColor = 'rgba(190,220,255,0.55)';
    if (energy > 0) {
      status = 'ENERGY ' + energy.toFixed(1) + 's — REACH A CHARGE STATION';
      statusColor = C.yellow;
    } else if (phase === 'surface' && drayne && drayne.state === 'beam') {
      status = 'SIPHON ACTIVE — CROSS THE BEAM';
      statusColor = C.pink;
    } else if (phase === 'surface') {
      status = 'BASE CONSTRUCTION ' + Math.floor(baseProgress) + '%';
      statusColor = baseProgress > 70 ? C.red : 'rgba(255,77,210,0.75)';
    } else {
      status = core ? 'CORE INTEGRITY ' + Math.max(0, Math.ceil(core.hp / core.max * 100)) + '%' : 'POWER CORE';
      statusColor = C.yellow;
    }
    text(status, 334, 683, 8, statusColor, 'left');

    // Right radar + MECO.
    drawLocalRadar(710, 600, 120, 92);
    drawMecoMeter(856, 612, 24, 68);

    // Level marker.
    text('LEVEL ' + pad(level, 2), 930, 606, 8, 'rgba(255,77,210,0.65)', 'right');
    text(muted ? 'MUTED' : 'AUDIO', 930, 628, 7, 'rgba(190,220,255,0.35)', 'right');
  }

  /* ============================================================
     Rendering: title + overlays
     ============================================================ */
  const TITLE_FONT = {
    R: ['11110', '10001', '10001', '11110', '10100', '10010', '10001'],
    E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
    P: ['11110', '10001', '10001', '11110', '10000', '10000', '10000'],
    T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
    O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'],
    N: ['10001', '11001', '11001', '10101', '10011', '10011', '10001']
  };

  function drawTitleLogo(cx, y) {
    const word = 'REPTON';
    const scale = 11;
    const gap = 11;
    const cell = 8;
    const totalW = word.length * 5 * cell + (word.length - 1) * gap;
    let x0 = cx - totalW / 2;
    for (let li = 0; li < word.length; li++) {
      const pat = TITLE_FONT[word[li]];
      for (let row = 0; row < pat.length; row++) {
        for (let col = 0; col < 5; col++) {
          if (pat[row][col] !== '1') continue;
          const px = x0 + col * cell;
          const py = y + row * cell;
          const t = (row / 7) * 0.65 + (col / 5) * 0.35;
          let color = t < 0.34 ? C.pink : t < 0.62 ? C.purple : C.green;
          if ((col + row * 2 + li) % 9 === 0) color = C.yellow;
          ctx.save();
          ctx.shadowColor = color;
          ctx.shadowBlur = 9;
          ctx.fillStyle = color;
          ctx.fillRect(px, py, cell - 1.5, cell - 1.5);
          ctx.restore();
        }
      }
      x0 += 5 * cell + gap;
    }
    // Underline rail.
    line(cx - totalW / 2, y + 65, cx + totalW / 2, y + 65, C.pink, 2, 0.5);
  }

  function drawTitleCity() {
    // Decorative skyline across the title screen.
    for (let x = 0; x < W; x += 18) {
      const h = 10 + Math.abs(Math.sin(x * 0.031) * 40) + (x % 54 === 0 ? 12 : 0);
      const top = GROUND_Y - h;
      ctx.fillStyle = 'rgba(7,24,10,0.95)';
      ctx.fillRect(x + 1, top, 16, h);
      ctx.strokeStyle = x % 36 === 0 ? C.pink : C.green;
      ctx.globalAlpha = 0.72;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 1.5, top + 1, 15, h - 2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = x % 36 === 0 ? C.yellow : C.pink;
      for (let yy = top + 7; yy < GROUND_Y - 4; yy += 12) {
        ctx.fillRect(x + 5, yy, 2, 2);
        ctx.fillRect(x + 10, yy, 2, 2);
      }
    }
    ctx.fillStyle = C.yellow;
    ctx.fillRect(0, GROUND_Y, W, 3);
    ctx.fillStyle = '#1d0722';
    ctx.fillRect(0, GROUND_Y + 3, W, 8);
    ctx.fillStyle = C.pink;
    ctx.fillRect(0, GROUND_Y + 11, W, 2);
  }

  function drawTitle() {
    drawStars();

    // Distant dish silhouette on the right.
    ctx.save();
    ctx.globalAlpha = 0.35;
    const bx = 760;
    for (let col = 0; col < BASE_HEIGHTS.length; col++) {
      const h = BASE_HEIGHTS[col];
      for (let row = 0; row < h; row++) {
        const x = bx + col * 8;
        const y = GROUND_Y - (row + 1) * 7;
        ctx.strokeStyle = C.pink;
        ctx.strokeRect(x + 0.5, y + 0.5, 7, 6);
      }
    }
    ctx.restore();

    drawTitleCity();

    glowText('SIRIUS PRESENTS', W / 2, 76, 17, C.pink, 'center', 12);
    drawTitleLogo(W / 2, 112);

    text('BY DAN THOMPSON', W / 2, 300, 12, C.green);
    text('AND ANDY KALUZNIACKI', W / 2, 320, 12, C.green);
    text('COPYRIGHT 1983 SIRIUS SOFTWARE INC.', W / 2, 346, 11, C.yellow);

    text('DEFEND THE COLONY  ·  STOP THE BASE  ·  DESTROY THE CORE', W / 2, 385, 10, 'rgba(190,220,255,0.55)');

    // Hero ship hovering over the city.
    ctx.save();
    const bob = Math.sin(time * 1.7) * 4;
    ctx.translate(W / 2, 420 + bob);
    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 16;
    drawFighter(1.35);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 3.2);
    glowText('PRESS SPACE BAR TO PLAY', W / 2, 620, 20, C.cyan, 'center', 14);
    ctx.restore();
    text('ARROWS / A D  THRUST & STEER     SPACE  FIRE', W / 2, 650, 10, 'rgba(190,220,255,0.55)');
    text('SHIFT  SHIELD (NO STEERING)     N  NUKE     P  PAUSE', W / 2, 668, 10, 'rgba(190,220,255,0.55)');
    text('HI SCORE  ' + pad(hiScore, 6), W / 2, 694, 11, 'rgba(255,225,77,0.8)');
    text(muted ? 'MUTED' : 'M — AUDIO', W - 26, 694, 8, 'rgba(190,220,255,0.35)', 'right');
  }

  function drawMessage() {
    if (msgTimer <= 0 || state === 'title') return;
    const a = Math.min(1, msgTimer / 0.35) * Math.min(1, (msgMax - msgTimer) / 0.12);
    const pulse = 0.72 + 0.28 * Math.sin(time * 14);
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    const off = (msgMain === 'ALERT' || msgMain === 'WARNING') ? Math.sin(time * 50) * 1.6 : 0;
    glowText(msgMain, W / 2 + off, 170, 33, msgColor, 'center', 18);
    if (msgSub) text(msgSub, W / 2, 201, 12, 'rgba(225,238,255,0.78)');
    if (msgMain === 'ALERT' || msgMain === 'WARNING') {
      ctx.strokeStyle = msgColor;
      ctx.globalAlpha = 0.45 * pulse * clamp(a, 0, 1);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 210, 152);
      ctx.lineTo(W / 2 + 210, 152);
      ctx.moveTo(W / 2 - 180, 220);
      ctx.lineTo(W / 2 + 180, 220);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBanner() {
    if (bannerTimer <= 0 || state === 'title') return;
    const total = 2.9;
    const fade = Math.min(1, bannerTimer / 0.45) * Math.min(1, (total - bannerTimer) / 0.25 + 0.15);
    ctx.save();
    ctx.globalAlpha = clamp(fade, 0, 1);
    glowText(bannerMain, W / 2, 278, 27, bannerColor, 'center', 14);
    text(bannerSub, W / 2, 307, 11, 'rgba(225,238,255,0.7)');
    ctx.restore();
  }

  function drawPause() {
    ctx.fillStyle = 'rgba(2,1,6,0.72)';
    ctx.fillRect(0, 0, W, H);
    glowText('PAUSED', W / 2, 300, 46, C.cyan, 'center', 20);
    text('PRESS P TO RESUME', W / 2, 350, 13, 'rgba(190,220,255,0.7)');
    text('ARROWS THRUST   SPACE FIRE   SHIFT SHIELD   N NUKE   M MUTE', W / 2, 382, 9, 'rgba(190,220,255,0.38)');
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(2,1,6,0.78)';
    ctx.fillRect(0, 0, W, H);
    glowText('GAME OVER', W / 2, 268, 50, C.pink, 'center', 22);
    text('FINAL SCORE  ' + pad(score, 6), W / 2, 330, 15, C.white);
    text('HI SCORE  ' + pad(hiScore, 6), W / 2, 356, 11, 'rgba(255,225,77,0.8)');
    if (Math.sin(time * 3.2) > -0.3) {
      text('PRESS SPACE TO DEFEND AGAIN', W / 2, 414, 13, C.cyan);
    }
  }

  function drawBombOverlay() {
    if (state !== 'bomb') return;
    const t = bombTimer;
    let main = '';
    let sub = '';
    let color = C.red;
    if (t < 1.15) {
      main = 'PLANET DEFENSES TRIGGERED';
      sub = 'QUARRIOR BASE COMPLETE — SURFACE PURGE ARMED';
    } else if (t < 2.45) {
      main = 'SURFACE PURGED';
      sub = 'ALL SURFACE FORCES LOST';
      color = C.yellow;
      const a = clamp((t - 1.15) / 0.8, 0, 1) * (1 - clamp((t - 2.1) / 0.35, 0, 1));
      ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.7) + ')';
      ctx.fillRect(0, 0, W, H);
    } else {
      main = 'DESCENDING TO CAVERNS';
      sub = 'RADAR SYSTEMS OFFLINE';
      color = C.cyan;
    }
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 12);
    text(main, W / 2, 250, 22, color);
    ctx.restore();
    text(sub, W / 2, 280, 10, 'rgba(225,238,255,0.7)');
    if (t < 1.2 && Math.floor(t * 8) % 2 === 0) {
      ctx.strokeStyle = C.red;
      ctx.lineWidth = 2;
      ctx.strokeRect(22, 22, W - 44, H - 44);
    }
  }

  function drawCoreBoomOverlay() {
    if (state !== 'coreboom') return;
    ctx.fillStyle = 'rgba(255,80,30,' + (0.08 + Math.abs(Math.sin(time * 14)) * 0.1) + ')';
    ctx.fillRect(0, 0, W, H);
    glowText('CORE BREACH', W / 2, 236, 30, C.yellow, 'center', 18);
    text('CHAIN REACTION IN PROGRESS', W / 2, 270, 11, C.orange);
  }

  function drawLevelClear() {
    if (state !== 'levelclear') return;
    ctx.fillStyle = 'rgba(2,1,6,0.68)';
    ctx.fillRect(0, 0, W, H);
    glowText('POWER CORE DESTROYED', W / 2, 250, 29, C.yellow, 'center', 18);
    text('LEVEL ' + pad(level, 2) + ' CLEARED', W / 2, 292, 15, C.cyan);
    text('BONUS  +' + clearBonus, W / 2, 322, 13, C.green);
    text('NEXT SURFACE DEPLOYMENT IN ' + Math.max(0, clearTimer).toFixed(1), W / 2, 356, 10, 'rgba(190,220,255,0.55)');
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (state === 'title') {
      drawTitle();
      return;
    }

    ctx.save();
    if (shake > 0.5) {
      ctx.translate(rand(-shake, shake) * 0.35, rand(-shake, shake) * 0.35);
    }

    if (phase === 'surface') drawSurfaceScene();
    else drawCavernScene();

    ctx.restore();

    drawHUD();
    drawMessage();
    drawBanner();
    drawBombOverlay();
    drawCoreBoomOverlay();
    drawLevelClear();

    if (flash > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (paused) drawPause();
    if (state === 'gameover') drawGameOver();
  }

  /* ============================================================
     Main loop
     ============================================================ */
  let last = 0;
  function frame(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    dt = clamp(dt, 0, 0.05);
    time += dt;

    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
