<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 240" role="img" aria-labelledby="cycleTitle cycleDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <title id="cycleTitle">The reification cycle</title>
  <desc id="cycleDesc">usd1 passes through an application to become usd2, then through the application again to become usd3. The first pass is lossy, so usd1 is not equal to usd2. The second pass is stable, so usd2 equals usd3. Reification is a projection, not an inverse.</desc>

  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- nodes -->
  <g>
    <rect x="40" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">usd1</text>

    <rect x="225" y="100" width="160" height="70" rx="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="305" y="143" text-anchor="middle" font-size="13" fill="#334155">application</text>

    <rect x="450" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="510" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">usd2</text>

    <rect x="635" y="100" width="160" height="70" rx="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="715" y="143" text-anchor="middle" font-size="13" fill="#334155">application</text>

    <rect x="860" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="920" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">usd3</text>
  </g>

  <!-- first pass: lossy -->
  <g stroke="#b45309" stroke-width="1.8">
    <line x1="160" y1="135" x2="219" y2="135" marker-end="url(#arrowAmber)"/>
    <line x1="385" y1="135" x2="444" y2="135" marker-end="url(#arrowAmber)"/>
  </g>

  <!-- second pass: stable -->
  <g stroke="#1d4ed8" stroke-width="1.8">
    <line x1="570" y1="135" x2="629" y2="135" marker-end="url(#arrowBlue)"/>
    <line x1="795" y1="135" x2="854" y2="135" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- annotations -->
  <g font-size="11">
    <text x="305" y="207" text-anchor="middle" fill="#92400e">first pass: lossy</text>
    <text x="715" y="207" text-anchor="middle" fill="#1e40af">second pass: stable</text>
  </g>

  <g>
    <rect x="470" y="190" width="80" height="26" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="510" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">≠ usd1</text>

    <rect x="880" y="190" width="80" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="920" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">= usd2</text>
  </g>

  <!-- bottom line -->
  <text x="500" y="260" text-anchor="middle" font-size="13" fill="#374151">Reification is a projection onto the application's representable subspace.</text>
  <text x="500" y="286" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6b7280">R(R(x)) = R(x), while R(x) ≠ x</text>
</svg>
